# Ejemplo para ejecutar el radar con GitHub Actions (cópialo a .github/workflows/radar.yml).
# Secretos necesarios: ANTHROPIC_API_KEY y LEAD_OPS_CLAVE.
# OJO en repos públicos: los registros de cada ejecución los puede ver cualquiera. Por eso el radar
# se lanza con la salida redirigida a /dev/null y solo se sube privado.enc (cifrado).
name: radar
on:
  schedule:
    - cron: "0 5 * * 1-5"   # 06:00 en Madrid en invierno (cron va en UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Descifrar datos privados
        run: npm run descifrar > /dev/null
        env:
          LEAD_OPS_CLAVE: ${{ secrets.LEAD_OPS_CLAVE }}
      - name: Radar (sin registros visibles)
        run: npm run radar > /dev/null 2>&1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Cifrar y subir
        env:
          LEAD_OPS_CLAVE: ${{ secrets.LEAD_OPS_CLAVE }}
        run: |
          npm run cifrar > /dev/null
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add privado.enc
          git commit -m "Actualización automática" || exit 0
          git push
